<!DOCTYPE html>
<html lang="tr" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>App Legal & Policies | flappsio</title>
    <meta
      name="description"
      content="Mobil uygulamalarımıza ait gizlilik politikaları, kullanım koşulları ve yasal bilgilendirmeler."
    />
    <link rel="icon" type="image/png" href="/assets/images/logo.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Inline script to prevent theme flashing on load -->
    <script>
      (function () {
        try {
          const params = new URLSearchParams(window.location.search);
          const urlTheme = params.get("theme");
          const savedTheme = localStorage.getItem("theme");
          const prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme =
            urlTheme === "light" || urlTheme === "dark"
              ? urlTheme
              : savedTheme || (prefersDark ? "dark" : "light");

          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.classList.remove("light");
          } else {
            document.documentElement.classList.add("light");
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
