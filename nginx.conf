server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative behind the HTTPS reverse proxy (Coolify/Cloudflare).
    absolute_redirect off;

    # Legacy URLs go directly to their canonical destination in one hop.
    location ~ ^/(?:crosshair|crossio)/(?:terms-of-use|terms-of-service)(?:\.html)?/?$ {
        # The canonical URL must render instead of redirecting to itself.
        if ($uri != /crossio/terms-of-use) {
            return 301 /crossio/terms-of-use$is_args$args;
        }
        try_files /crossio/terms-of-use/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ ^/(?:crosshair|crossio)/privacy-policy(?:\.html)?/?$ {
        if ($uri != /crossio/privacy-policy) {
            return 301 /crossio/privacy-policy$is_args$args;
        }
        try_files /crossio/privacy-policy/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ ^/crosshair/?$ {
        return 301 /crossio$is_args$args;
    }

    location ~ ^/crosshair/(.+?)/?$ {
        return 301 /crossio/$1$is_args$args;
    }

    location ~ ^/(privacy-policy|terms-of-use|terms-of-service)(?:\.html)?/?$ {
        set $legal_page $1;
        if ($legal_page = terms-of-service) {
            set $legal_page terms-of-use;
        }
        return 301 /crossio/$legal_page$is_args$args;
    }

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Güvenlik başlıkları
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Coolify & Docker Healthcheck endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Statik asset dosyaları için önbellekleme
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Serve prerendered pages without a directory/slash redirect; otherwise use SPA.
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
