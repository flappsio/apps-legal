<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Yönlendiriliyor... - Crossio Gizlilik Politikası</title>
  <script>
    (function() {
      const search = window.location.search || "";
      const path = window.location.pathname;
      let target = "crosshair/privacy-policy.html";
      if (path.endsWith("/privacy-policy.html") || path.endsWith("/privacy-policy")) {
        const basePath = path.substring(0, path.lastIndexOf("/") + 1);
        target = basePath + "crosshair/privacy-policy.html";
      }
      window.location.replace(target + search);
    })();
  </script>
</head>
<body style="background-color: #12131A; color: #F2F1F0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p>Gizlilik Politikasına yönlendiriliyorsunuz... <a id="redirectLink" href="./crosshair/privacy-policy.html" style="color: #69F0AE;">Buraya tıklayın</a>.</p>
  <script>
    document.getElementById('redirectLink').href = "./crosshair/privacy-policy.html" + (window.location.search || "");
  </script>
</body>
</html>
