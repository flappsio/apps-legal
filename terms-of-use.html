<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Yönlendiriliyor... - Crossio Kullanım Koşulları</title>
  <script>
    (function() {
      const search = window.location.search || "";
      window.location.replace("/crossio/terms-of-use" + search + window.location.hash);
    })();
  </script>
</head>
<body style="background-color: #12131A; color: #F2F1F0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p>Kullanım Koşullarına yönlendiriliyorsunuz... <a id="redirectLink" href="/crossio/terms-of-use" style="color: #69F0AE;">Buraya tıklayın</a>.</p>
  <script>
    document.getElementById('redirectLink').href = "/crossio/terms-of-use" + window.location.search + window.location.hash;
  </script>
</body>
</html>
